<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Broker Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <!-- "Where should I hold my investments?" - Tools, per
         docs/legacy-feature-inventory.md. Supabase-only (brokers table,
         supabase/migrations/0005_product_database.sql), same
         authenticated-only simplification as Securities - no mock
         fallback, no anon access yet (see that migration's own RLS
         note). Real data: 10 brokers transcribed verbatim from the old
         Portfol.io app's Excel-derived database
         (0006_seed_products_and_brokers.sql), never estimated. -->
    <section class="card glass interactive" id="brokers-card">
      <div class="card-header">
        <div class="card-header-title" data-info="broker-comparison" tabindex="0" role="button" aria-label="About this page">
          <h2 class="section-title">Broker Comparison</h2>
        </div>
      </div>
      <p class="section-hint" id="brokers-summary"></p>

      <div class="product-library-controls">
        <input type="search" id="broker-search" class="product-search" placeholder="Search by name or country…" autocomplete="off">
      </div>

      <div id="brokers-body"></div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

</body>
