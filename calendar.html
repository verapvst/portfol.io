<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=152">
<link rel="stylesheet" href="css/layout.css?v=152">
<link rel="stylesheet" href="css/components.css?v=152">
<link rel="stylesheet" href="css/calendar.css?v=152">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <!-- Activity: the monthly routine (what's due) + a plain feed of what
         was recorded. Same page for everyone - the structure is public,
         anything private is replaced by the shared lock. -->
    <section class="card glass" id="act-due-card">
      <div class="card-header act-header">
        <div class="card-header-title"><h2 class="section-title">Updates due</h2></div>
        <span class="act-badge" id="act-due-badge"></span>
      </div>
      <p class="section-hint" id="act-due-hint"></p>
      <div id="act-due-body"><p class="act-empty">Loading…</p></div>
    </section>

    <section class="card glass" id="act-feed-card">
      <div class="card-header act-header">
        <div class="card-header-title"><h2 class="section-title">Recent activity</h2></div>
        <div class="filter-pills glass-quiet" id="act-feed-pills"></div>
      </div>
      <div id="act-feed"></div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js?v=152"></script>
<script src="js/supabaseClient.js?v=152"></script>

<script src="js/utils.js?v=152"></script>
<script src="js/calculations.js?v=152"></script>
<script src="js/repository.js?v=152"></script>

<script src="js/charts.js?v=152"></script>
<script src="js/shell.js?v=152"></script>
<script src="js/auth.js?v=152"></script>
<script src="js/db.js?v=152"></script>
<script src="js/analytics.js?v=152"></script>
<script src="js/calendar-events.js?v=152"></script>
<script src="js/calendar.js?v=152"></script>
</body>
</html>
