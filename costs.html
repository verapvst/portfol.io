<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Costs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=84">
<link rel="stylesheet" href="css/layout.css?v=84">
<link rel="stylesheet" href="css/components.css?v=84">
<link rel="stylesheet" href="css/costs.css?v=84">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <section class="card glass" id="costs-card">
      <div class="card-header costs-card-header-row">
        <div class="card-header-title">
          <h2 class="section-title">Costs</h2>
        </div>
        <button class="add-cost-btn" id="add-cost-btn" type="button">+ Add Cost</button>
      </div>
      <p class="section-hint">TERs, custody fees, commissions — reads and writes Supabase directly. Insert-only: a changed fee is a new dated row, not an edit.</p>
      <div class="costs-toolbar">
        <select id="costs-filter-category"><option value="">All categories</option></select>
      </div>
      <div id="costs-table-container"></div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js?v=84"></script>
<script src="js/supabaseClient.js?v=84"></script>

<script src="js/utils.js?v=84"></script>
<script src="js/shell.js?v=84"></script>
<script src="js/auth.js?v=84"></script>
<script src="js/db.js?v=84"></script>
<script src="js/costs.js?v=84"></script>
</body>
</html>
