<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Data Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=74">
<link rel="stylesheet" href="css/layout.css?v=74">
<link rel="stylesheet" href="css/components.css?v=74">
<link rel="stylesheet" href="css/data-hub.css?v=74">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <div class="datahub-grid">

      <!-- 1. Import Reports -->
      <section class="card glass" id="import-card">
        <div class="card-header">
          <div class="card-header-title" data-info="data-hub-import" tabindex="0" role="button" aria-label="About this section">
            <h2 class="section-title">Import Reports</h2>
          </div>
        </div>
        <p class="section-hint">Every piece of data enters Portfol.io through here.</p>

        <div class="drop-zone glass-quiet" id="drop-zone" tabindex="0" role="button" aria-label="Upload report files">
          <span class="drop-zone-icon" id="drop-zone-icon"></span>
          <p class="drop-zone-title">Drag &amp; drop reports here, or click to choose files</p>
          <p class="drop-zone-sub">PDF, from any month, any BPI fund</p>
          <input type="file" id="file-input" accept="application/pdf" multiple hidden>
        </div>

        <div class="source-chip-list" id="source-chip-list"></div>
      </section>

      <!-- Per-file processing timelines -->
      <div id="processing-list" class="processing-list"></div>

      <!-- Per-fund groups: Preview + Import -->
      <div id="groups-list"></div>

    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js?v=74"></script>
<script src="js/supabaseClient.js?v=74"></script>

<script src="js/utils.js?v=74"></script>
<script src="js/calculations.js?v=74"></script>
<script src="js/repository.js?v=74"></script>
<script src="js/shell.js?v=74"></script>
<script src="js/auth.js?v=74"></script>
<script src="js/db.js?v=74"></script>

<script src="js/importer/vendor/pdf.min.js?v=74"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = "js/importer/vendor/pdf.worker.min.js?v=74";</script>
<script src="js/importer/field.js?v=74"></script>
<script src="js/importer/numbers.js?v=74"></script>
<script src="js/importer/pdfReader.js?v=74"></script>
<script src="js/importer/classifier.js?v=74"></script>
<script src="js/importer/monthlyFactsheetParser.js?v=74"></script>
<script src="js/importer/holdingsReportParser.js?v=74"></script>
<script src="js/importer/consolidate.js?v=74"></script>
<script src="js/importer/geoClassifier.js?v=74"></script>

<script src="js/data-hub.js?v=74"></script>
</body>
</html>
