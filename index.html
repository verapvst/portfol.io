<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=63">
<link rel="stylesheet" href="css/layout.css?v=63">
<link rel="stylesheet" href="css/components.css?v=63">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <!-- Two-column hierarchy: LEFT = primary analytical views, RIGHT =
         supporting summary cards. See css/layout.css .overview-columns. -->
    <div class="overview-columns">

      <div class="overview-left">

        <!-- 1. Portfolio Snapshot - compact 2x2 -->
        <div id="kpi-grid" class="kpi-grid"></div>

        <!-- 2. Investment Performance - a SUMMARY now, not the full
             interactive chart: docs/information-architecture.md gives
             Performance its own dedicated page (range filters, benchmark
             comparison, cumulative/annualised breakdown all live there
             once it's built - this card exists to headline the number
             and hand off, not duplicate that page's content). -->
        <section class="card glass interactive" id="performance-card">
          <div class="card-header">
            <div class="card-header-title" data-info="investment-performance" tabindex="0" role="button" aria-label="About this metric">
              <h2 class="section-title">Investment Performance</h2>
            </div>
          </div>
          <div class="perf-value-row">
            <span class="perf-value" id="perf-value"></span>
          </div>
          <p class="perf-secondary" id="perf-secondary"></p>
          <div class="perf-stat-row" id="perf-investor-return" data-drill-type="kpi" data-drill-id="investorReturn" tabindex="0" role="button" aria-label="Investor Return details">
            <span class="perf-stat-label">Investor Return (XIRR)</span>
            <span class="perf-stat-value" id="perf-investor-return-value"></span>
          </div>
          <div id="linechart-container"></div>
          <div id="perf-more-link"></div>
        </section>

        <!-- 3. Portfolio Insights -->
        <section class="card glass interactive" id="insights-card">
          <div class="card-header">
            <div class="card-header-title" data-info="portfolio-insights" tabindex="0" role="button" aria-label="About this metric">
              <h2 class="section-title">Portfolio Insights</h2>
            </div>
          </div>
          <p class="section-hint">Rule-based, not AI-generated</p>
          <div id="portfolio-insights"></div>
        </section>

      </div>

      <div class="overview-right">

        <!-- 4. Portfolio Allocation - asset-class summary only now.
             Geography, sector, currency, style and the Product/Account
             breakdowns all move to the dedicated Allocation page
             (docs/information-architecture.md) - this card headlines the
             single most important split and a geography highlight, then
             hands off instead of duplicating that page's full tab set. -->
        <section class="card glass interactive" id="allocation-card">
          <div class="card-header">
            <div class="card-header-title" data-info="portfolio-allocation" tabindex="0" role="button" aria-label="About this metric">
              <h2 class="section-title">Portfolio Allocation</h2>
            </div>
          </div>
          <p class="section-hint">By asset class</p>
          <div id="allocation-summary"></div>
        </section>

        <!-- 5. Top Holdings - a preview of Portfolio Detail, not a
             duplicate of it. -->
        <section class="card glass interactive" id="holdings-card">
          <div class="card-header">
            <div class="card-header-title" data-info="top-holdings" tabindex="0" role="button" aria-label="About this metric">
              <h2 class="section-title">Top Holdings</h2>
            </div>
          </div>
          <p class="section-hint">Top 5 positions by weight</p>
          <div id="holdings-table"></div>
        </section>

        <!-- 6. Portfolio Health -->
        <section class="card glass interactive" id="health-card">
          <div class="card-header">
            <div class="card-header-title" data-info="portfolio-health" tabindex="0" role="button" aria-label="About this metric">
              <h2 class="section-title">Portfolio Health</h2>
            </div>
          </div>
          <p class="section-hint">Objective structural facts</p>
          <div id="portfolio-health"></div>
        </section>

      </div>

    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js?v=63"></script>
<script src="js/supabaseClient.js?v=63"></script>

<script src="js/utils.js?v=63"></script>
<script src="js/calculations.js?v=63"></script>
<script src="js/repository.js?v=63"></script>

<script src="vendor/d3.min.js?v=63"></script>
<script src="vendor/topojson-client.min.js?v=63"></script>

<script src="js/charts.js?v=63"></script>
<script src="js/shell.js?v=63"></script>
<script src="js/auth.js?v=63"></script>
<script src="js/db.js?v=63"></script>
<script src="js/analytics.js?v=63"></script>
<script src="js/ui.js?v=63"></script>
<script src="js/app.js?v=63"></script>
</body>
</html>
