<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfol.io — Logo Animation Prototype</title>
<meta name="description" content="Standalone prototype only — not linked from the production app.">

<!-- Same web font the production app loads (index.html <head>) — Inter.
     Not used for any logo text below (the real logo-wordmark.png asset is
     reused as-is for "Portfol.io" / "Fund your future"), only for the
     prototype's own UI chrome (label, replay button). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     Design tokens copied 1:1 from css/theme.css and js/utils.js
     (PALETTE / PRIMARY_GRADIENT_STOPS) — the project's single
     source of truth for colour. Nothing below is invented.
     ============================================================ */
  :root {
    --bg: #FFFFFF;
    --ink: #2B2724;
    --muted: #8A807A;

    --amber-1: #FFD06A; --amber-2: #FFB34A;
    --orange-1: #FFB35F; --orange-2: #FF9447;
    --coral-1: #FF8E73; --coral-2: #FF6D63;
    --pink-1: #FF97B5; --pink-2: #F56D9A;

    /* Two curves, two jobs — not a grab-bag of easings.
       ENTRANCE: things arriving/settling into place (fast start, long
       gentle stop) — this is the app's own house curve, css/layout.css .rise.
       PROCESS: things being drawn/dissolving over time (gentle at both
       ends) — used only for the ring's construction and the final colour
       resolve, where a symmetric curve reads as continuous rather than "arriving". */
    --ease-entrance: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-process: cubic-bezier(0.65, 0, 0.35, 1);

    --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 16px;
  }

  /* ---------- prototype chrome (not part of the brand) ---------- */
  .proto-label {
    position: fixed;
    top: 16px;
    left: 16px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .replay-btn {
    appearance: none;
    border: 1px solid #E4DFDA;
    background: #FAFAF9;
    color: var(--muted);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .replay-btn:hover { color: var(--ink); border-color: #D8D2CB; background: #F3F1EE; }
  .replay-btn:active { transform: translateY(1px); }

  /* ============================================================
     THE LOCKUP
     Fixed-size authored layout, scaled uniformly by breakpoint so
     every internal offset (computed from the real PNG assets)
     stays correct at any size. Nothing here is enormous on desktop
     or tiny on mobile — see media queries at the bottom.
     ============================================================ */

  .lockup {
    position: relative;
    width: 340px;
    height: 300px;
    transform: scale(1);
  }

  .lockup-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- icon construction stage — pure SVG throughout.
       Deliberately never swapped for the raster logo-icon.png: any
       crossfade between a hand-built approximation and the real asset
       is itself a small discontinuity, and this build already tracks
       the real asset's geometry almost exactly (see the pixel-measured
       bar/dot/ring bounding boxes below). One continuous element,
       start to finish, is more faithful to "nothing simply appears or
       disappears" than a pixel-perfect swap would be. ---------- */
  .icon-stage {
    position: relative;
    width: 200px;
    height: 165px;
    margin-top: 4px;
  }

  .icon-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* ---------- wordmark / tagline (real asset crop-reveal) ---------- */
  /* assets/images/logo-wordmark.png is 824x303px.
     "Portfol.io" bbox: (20,32)-(778,179).  "Fund your future" bbox: (20,214)-(532,279).
     Both crops share one scale factor k = 320/758 = 0.4222 so their
     type sizes stay in the exact ratio they have in the real asset. */
  .word-crop, .tag-crop {
    position: relative;
    overflow: hidden;
  }
  .word-crop { width: 320px; height: 62.05px; margin-top: 16px; }
  .tag-crop  { width: 216.2px; height: 27.44px; margin-top: 3px; }

  .word-crop img, .tag-crop img {
    position: absolute;
    width: 347.9px;
    max-width: none;
  }
  .word-crop img { left: -8.44px; top: -13.51px; }
  .tag-crop img  { left: -8.44px; top: -90.34px; }

  /* ============================================================
     ANIMATION — choreographed, not just "slow".
     Every stage below is: entrance → hold (viewer registers it) →
     the next stage begins, caused by what's already on screen.
     Total run time ≈ 10s. See the accompanying report for the
     full beat-by-beat timeline and the reasoning behind it.
     ============================================================ */

  /* ---- resting (pre-play / post-reset) state for every animated part ---- */
  #bar1, #bar2, #bar3 { height: 0px; y: 298px; }
  #dot {
    opacity: 0;
    transform: translate(18px, -46px) rotate(-6deg) scale(0.9);
    transform-box: fill-box;
    transform-origin: center;
  }
  #ring { opacity: 0; stroke-dashoffset: 287.7px; }
  #iconGroup { transform: scale(1.035); transform-origin: 191px 169px; }

  .word-crop {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    transform: translateY(10px);
  }
  .tag-crop {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    transform: translateY(10px);
    filter: grayscale(1);
  }

  /* ---- Stage 1–3: the three bars, each grows from the shared
     baseline, then the composition holds still before the next
     bar begins — never overlapping, always the same baseline. ---- */
  .lockup.play #bar1 { animation: barGrow1 0.8s var(--ease-entrance) 0.1s forwards; }
  .lockup.play #bar2 { animation: barGrow2 0.8s var(--ease-entrance) 1.25s forwards; }
  .lockup.play #bar3 { animation: barGrow3 0.8s var(--ease-entrance) 2.4s forwards; }

  @keyframes barGrow1 { to { height: 106px; y: 192px; } }
  @keyframes barGrow2 { to { height: 187px; y: 111px; } }
  @keyframes barGrow3 { to { height: 233px; y: 65px; } }

  /* ---- Stage 4: the coin. Travels in from above the tallest bar,
     decelerating the whole way — no bounce, no overshoot, just a
     single confident arrival exactly where the "i" dot belongs. ---- */
  .lockup.play #dot { animation: coinArrive 0.8s var(--ease-entrance) 3.8s forwards; }

  @keyframes coinArrive {
    to { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  /* ---- Stage 5: the ring is drawn directly in its final half-donut
     form — no full circle, no later clipping — starting at the point
     closest to bar 3 so it visibly grows outward from the chart that's
     already there, sweeping clockwise into the portfolio symbol. ---- */
  .lockup.play #ring { animation: ringDraw 1.0s var(--ease-process) 4.95s forwards; }

  @keyframes ringDraw {
    0%   { opacity: 0; stroke-dashoffset: 287.7px; }
    8%   { opacity: 1; }
    100% { opacity: 1; stroke-dashoffset: 0px; }
  }

  /* ---- Stage 6–7: the whole mark tightens into its final geometry
     and locks — a small, single settle, not a swap. Overlaps the tail
     of the ring's draw so the construction reads as one motion. ---- */
  .lockup.play #iconGroup { animation: markSettle 0.8s var(--ease-entrance) 5.85s forwards; }

  @keyframes markSettle { to { transform: scale(1); } }

  /* ---- Stage 8: the wordmark grows in directly beneath the now-
     settled mark — a soft wipe left-to-right (the reading direction)
     with a small rise, so it feels like it's continuing out of the
     mark rather than appearing from nowhere. ---- */
  .lockup.play .word-crop { animation: revealRise 1.1s var(--ease-entrance) 7.15s forwards; }

  @keyframes revealRise {
    to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); }
  }

  /* ---- Stage 9: the tagline follows the same reveal, but arrives
     desaturated — it is not yet wearing its brand colour.
     Stage 10: once settled, the final brand accent resolves — "Fund"
     eases into the existing coral as the grayscale lifts. This is the
     last thing that happens; nothing moves after it. ---- */
  .lockup.play .tag-crop {
    animation: revealRiseGray 0.7s var(--ease-entrance) 8.55s forwards,
               colorResolve 0.6s var(--ease-process) 9.45s forwards;
  }

  @keyframes revealRiseGray {
    to { opacity: 1; clip-path: inset(0 0 0 0); transform: translateY(0); filter: grayscale(1); }
  }

  @keyframes colorResolve { to { filter: grayscale(0); } }

  /* reduced motion: skip straight to the settled final frame */
  @media (prefers-reduced-motion: reduce) {
    .lockup.play #bar1, .lockup.play #bar2, .lockup.play #bar3,
    .lockup.play #dot, .lockup.play #ring, .lockup.play #iconGroup,
    .lockup.play .word-crop, .lockup.play .tag-crop {
      animation-duration: 0.01s !important;
      animation-delay: 0s !important;
    }
  }

  /* ---------- responsive scale (uniform transform, layout stays fixed-px) ---------- */
  @media (max-width: 480px) {
    .lockup { transform: scale(0.66); }
  }
  @media (min-width: 481px) and (max-width: 860px) {
    .lockup { transform: scale(0.85); }
  }
</style>
</head>
<body>

  <div class="proto-label">Prototype — not part of the live site</div>

  <div class="lockup" id="lockup">
    <div class="lockup-inner">

      <div class="icon-stage">
        <!-- Hand-built construction: bars → coin → ring, using the
             exact PRIMARY_GRADIENT_STOPS (amber→orange→coral→pink) and
             the pixel-measured geometry of assets/images/logo-icon.png. -->
        <svg class="icon-svg" viewBox="0 0 361 298" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  style="stop-color:var(--amber-1)"/>
              <stop offset="35%" style="stop-color:var(--orange-2)"/>
              <stop offset="70%" style="stop-color:var(--coral-2)"/>
              <stop offset="100%" style="stop-color:var(--pink-2)"/>
            </linearGradient>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  style="stop-color:var(--orange-1)"/>
              <stop offset="35%" style="stop-color:var(--coral-2)"/>
              <stop offset="70%" style="stop-color:var(--pink-1)"/>
              <stop offset="100%" style="stop-color:var(--pink-2)"/>
            </linearGradient>
          </defs>

          <g id="iconGroup">
            <rect id="bar1" x="0"   width="54" rx="27"   fill="url(#barGrad)"/>
            <rect id="bar2" x="79"  width="57" rx="28.5" fill="url(#barGrad)"/>
            <rect id="bar3" x="163" width="57" rx="28.5" fill="url(#barGrad)"/>
            <circle id="dot" cx="191" cy="27" r="27" fill="url(#barGrad)"/>

            <!-- half-donut, built once, in its final position: a semicircle
                 of radius 91.5 centred on (242,169), starting at the top
                 (closest point to bar 3) and sweeping clockwise. -->
            <path id="ring" d="M 242 77.5 A 91.5 91.5 0 0 1 242 260.5"
              fill="none" stroke="url(#ringGrad)" stroke-width="55"
              stroke-linecap="round"
              stroke-dasharray="287.7 287.7"/>
          </g>
        </svg>
      </div>

      <div class="word-crop">
        <img src="assets/images/logo-wordmark.png" alt="Portfol.io">
      </div>
      <div class="tag-crop">
        <img src="assets/images/logo-wordmark.png" alt="Fund your future">
      </div>

    </div>
  </div>

  <button class="replay-btn" id="replayBtn" type="button">Replay</button>

  <script>
    var lockup = document.getElementById('lockup');
    var btn = document.getElementById('replayBtn');

    function play() {
      lockup.classList.remove('play');
      void lockup.offsetWidth; // force reflow so the animation restarts
      lockup.classList.add('play');
    }

    btn.addEventListener('click', play);
    window.addEventListener('load', play);
  </script>

</body>
</html>
