<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=100">
<link rel="stylesheet" href="css/layout.css?v=100">
<link rel="stylesheet" href="css/components.css?v=100">
<link rel="stylesheet" href="css/performance.css?v=100">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <!-- Only rendered when signed in AND the live Supabase fetch failed
         (analytics.js's getPortfolioDataAuto() tags this case distinctly
         from the legitimate signed-out fallback) - makes an otherwise
         invisible "silently showing stale/mock data" state visible
         instead of looking identical to a real, current, flat chart. -->
    <div id="perf-data-warning"></div>

    <!-- "How has my portfolio performed?" - per
         docs/information-architecture.md §2. Deliberately answers this
         with Transactions/Valuations-derived numbers only, never a
         security's own market price return (a different question,
         belongs on that security's own page once Securities and
         daily_prices are live) - see the info popover on each metric. -->
    <div class="perf-stats-grid" id="perf-stats-grid"></div>

    <section class="card glass interactive" id="performance-chart-card">
      <div class="card-header">
        <div class="card-header-title" data-info="investment-performance" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title">Portfolio Value Over Time</h2>
        </div>
        <div class="filter-pills glass-quiet" id="perf-filters"></div>
      </div>
      <div id="perf-linechart-container"></div>
    </section>

    <!-- Same chain-linked TWR primitive as the headline number above,
         just sliced by calendar year (js/calculations.js:
         annualReturns()) - not a second calculation method. Years with
         no real growth signal yet (a data gap, not zero performance)
         are labelled honestly rather than shown as a flat 0%. -->
    <section class="card glass interactive" id="annual-returns-card">
      <div class="card-header">
        <div class="card-header-title" data-info="annual-returns" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title">Annual Returns</h2>
        </div>
      </div>
      <div id="annual-returns-body"></div>
    </section>

    <!-- Honest unavailable state, not a placeholder chart - no benchmark
         is configured and comparing to one needs daily_prices, which is
         explicitly still paused. See the "benchmark-comparison" info
         popover for exactly what's missing. -->
    <section class="card glass" id="benchmark-card">
      <div class="card-header">
        <div class="card-header-title" data-info="benchmark-comparison" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title">Benchmark Comparison</h2>
        </div>
      </div>
      <div id="benchmark-body"></div>
    </section>

    <!-- Phase 3 (Product & Architecture Re-Think plan §12) - Volatility/
         Max Drawdown/Sharpe/Sortino/Beta/Alpha/Correlation, computed
         from the exact same subPeriods/dailySeries the headline TWR and
         Benchmark Comparison above already produced (calculations.js:
         scopedQuantMetrics()) - never a second performance calculation.
         Each tile shows its own honest "Insufficient history" when its
         own real-data bar isn't met yet, never a fabricated number. -->
    <section class="card glass interactive" id="quant-metrics-card">
      <div class="card-header">
        <div class="card-header-title" data-info="quant-risk-metrics" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title">Risk &amp; Quant Metrics</h2>
        </div>
      </div>
      <div class="quant-metrics-grid" id="quant-metrics-grid"></div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js?v=100"></script>
<script src="js/supabaseClient.js?v=100"></script>

<script src="js/utils.js?v=100"></script>
<script src="js/calculations.js?v=100"></script>
<script src="js/repository.js?v=100"></script>

<script src="js/charts.js?v=100"></script>
<script src="js/shell.js?v=100"></script>
<script src="js/auth.js?v=100"></script>
<script src="js/db.js?v=100"></script>
<script src="js/analytics.js?v=100"></script>
<script src="js/performance.js?v=100"></script>
</body>
</html>
