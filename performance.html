<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=140">
<link rel="stylesheet" href="css/layout.css?v=140">
<link rel="stylesheet" href="css/components.css?v=140">
<link rel="stylesheet" href="css/performance.css?v=140">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <!-- Only rendered when signed in AND the live Supabase fetch failed
         (analytics.js's getPortfolioDataAuto() tags this case distinctly
         from the legitimate signed-out fallback) - makes an otherwise
         invisible "silently showing stale/mock data" state visible
         instead of looking identical to a real, current, flat chart. -->
    <div id="perf-data-warning"></div>

    <!-- Investment approach - a short, plain-language statement of the
         strategy this performance should be judged against. Static,
         owner-authored text (not derived from data). -->
    <section class="card glass perf-strategy-card" id="perf-strategy-card">
      <span class="perf-strategy-kicker">Strategy</span>
      <p class="perf-strategy-text">Beginner investor with a long-term objective, building a globally diversified portfolio over time.</p>
    </section>

    <!-- Scope selector: Portfolio / Accounts / Strategies / Securities,
         plus a second pill row for the specific entries within whichever
         type is selected. Same .filter-pill primitive as Portfolio
         page's own scope row (js/portfolio.js:renderScopeSelector()).
         Controls the stat tiles, Annual Returns, Benchmark Comparison
         and Risk & Quant Metrics below - the raw € Portfolio Value Over
         Time chart moved to the Capital page (Performance & Capital
         split) precisely because it has no per-scope series to be
         controlled by this selector in the first place (no per-scope
         raw € series exists in the data model). -->
    <section class="card glass interactive" id="perf-scope-card">
      <div class="filter-pills glass-quiet" id="perf-scope-type-row"></div>
      <div class="filter-pills glass-quiet" id="perf-scope-sub-row"></div>
      <p class="section-hint" id="perf-scope-hint"></p>
    </section>

    <!-- "How has my portfolio performed?" - per
         docs/information-architecture.md §2. Deliberately answers this
         with Transactions/Valuations-derived numbers only, never a
         security's own market price return (a different question,
         belongs on that security's own page once Securities and
         daily_prices are live) - see the info popover on each metric.
         Scope-aware: Total Return (TWR) reflects the selected scope;
         Investor Return (XIRR) is a portfolio-only concept (no per-
         account cash-flow aggregation exists yet) and is replaced with
         Volatility/Max Drawdown when an account/strategy/security is
         selected, rather than shown as a fabricated or silently-stale
         portfolio-wide number. Unrealised Gain moved to the Capital page
         (Performance & Capital split) - it's a € gain against cost
         basis, not a %-return, so it now lives with Contributions/
         Invested Capital instead of here. Period-windowed by the row
         below (1W/1M/3M/6M/YTD/1Y/Since Inception) - a different range
         control from Capital's own Portfolio Value Over Time filter-
         pills, on purpose (js/capital.js's own comment on this). -->
    <div class="filter-pills glass-quiet" id="perf-scoped-range-row"></div>
    <div class="perf-stats-grid" id="perf-stats-grid"></div>

    <!-- Honest unavailable state, not a placeholder chart - no benchmark
         is configured and comparing to one needs daily_prices, which is
         explicitly still paused. See the "benchmark-comparison" info
         popover for exactly what's missing. -->
    <section class="card glass" id="benchmark-card">
      <div class="card-header">
        <div class="card-header-title" data-info="benchmark-comparison" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title" id="benchmark-comparison-title">Benchmark Comparison</h2>
        </div>
      </div>
      <div id="benchmark-body"></div>
    </section>

    <!-- Same chain-linked TWR primitive as the headline number above,
         just sliced by calendar year (js/calculations.js:
         annualReturns()) - not a second calculation method. Years with
         no real growth signal yet (a data gap, not zero performance)
         are labelled honestly rather than shown as a flat 0%. Placed
         after Benchmark Comparison (not before it) and laid out as a
         compact horizontal strip - year on top, return underneath -
         rather than one row per year, so a decade of history reads as a
         glance-able ledger instead of a tall list (js/performance.js's
         own renderAnnualReturns() comment on this). -->
    <section class="card glass interactive" id="annual-returns-card">
      <div class="card-header">
        <div class="card-header-title" data-info="annual-returns" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title" id="annual-returns-title">Annual Returns</h2>
        </div>
      </div>
      <div id="annual-returns-body"></div>
    </section>

    <!-- Phase 3 (Product & Architecture Re-Think plan §12) - Volatility/
         Max Drawdown/Sharpe/Sortino/Beta/Alpha/Correlation, computed
         from the exact same subPeriods/dailySeries the headline TWR and
         Benchmark Comparison above already produced (calculations.js:
         scopedQuantMetrics()) - never a second performance calculation.
         Each tile shows its own honest "Insufficient history" when its
         own real-data bar isn't met yet, never a fabricated number. -->
    <section class="card glass interactive" id="quant-metrics-card">
      <div class="card-header">
        <div class="card-header-title" data-info="quant-risk-metrics" tabindex="0" role="button" aria-label="About this metric">
          <h2 class="section-title" id="quant-metrics-title">Risk &amp; Quant Metrics</h2>
        </div>
      </div>
      <div class="quant-metrics-grid" id="quant-metrics-grid"></div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="js/db.js?v=140"></script>
<script src="js/analytics.js?v=140"></script>
<script src="js/performance.js?v=140"></script>
</body>
</html>
