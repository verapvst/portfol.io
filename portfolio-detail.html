<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Portfolio Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <!-- "What do I have?" - per docs/information-architecture.md §2, this
         page owns the full position list, avg. cost and unrealised P&L;
         it deliberately does NOT repeat Performance's TWR/XIRR or
         Allocation's breakdown tabs, both of which link back here from
         Overview instead of duplicating this content themselves. -->
    <section class="card glass interactive" id="holdings-detail-card">
      <div class="card-header">
        <div class="card-header-title" data-info="portfolio-detail" tabindex="0" role="button" aria-label="About this page">
          <h2 class="section-title">Holdings</h2>
        </div>
      </div>
      <p class="section-hint" id="holdings-detail-summary"></p>
      <div id="holdings-detail-table"></div>
    </section>

  </main>

</div>
