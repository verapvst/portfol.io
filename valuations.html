<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfol.io — Valuations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css?v=41">
<link rel="stylesheet" href="css/layout.css?v=41">
<link rel="stylesheet" href="css/components.css?v=41">
<link rel="stylesheet" href="css/valuations.css?v=41">
</head>
<body>
<div id="app">

  <main id="main">
    <header id="topbar" class="topbar"></header>

    <section class="card glass" id="valuations-card">
      <div class="card-header valuations-card-header-row">
        <div class="card-header-title">
          <h2 class="section-title">Valuations</h2>
        </div>
        <button class="add-valuation-btn" id="add-valuation-btn" type="button">+ Add Valuation</button>
      </div>
      <p class="section-hint">Dated value observations — reads and writes Supabase directly. Insert-only: a wrong figure is superseded by a new dated row, never edited in place.</p>
      <div class="valuations-toolbar">
        <select id="valuations-filter-security"><option value="">All securities</option></select>
      </div>
      <div id="valuations-table-container"></div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseConfig.js?v=41"></script>
<script src="js/supabaseClient.js?v=41"></script>

<script src="js/utils.js?v=41"></script>
<script src="js/shell.js?v=41"></script>
<script src="js/auth.js?v=41"></script>
<script src="js/db.js?v=41"></script>
<script src="js/valuations.js?v=41"></script>
</body>
</html>
